name: Score Oracle

on:
  schedule:
    - cron: "17 */3 * * *"     # every 3 hours (GitHub may delay a run by an hour or two): keeps results fresh overnight
  workflow_dispatch:           # the "run now" button

permissions:
  contents: write

concurrency:
  group: oracle
  cancel-in-progress: false

jobs:
  predict:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore source cache
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: data/cache
          key: oracle-cache-${{ github.run_id }}
          restore-keys: oracle-cache-

      - name: Update data
        run: python -m oracle update

      - name: Save source cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/cache
          key: oracle-cache-${{ github.run_id }}

      - name: Backtest and learn weights (weekly)
        run: |
          python - <<'PY' > /tmp/age.txt
          import json, datetime as dt, pathlib
          p = pathlib.Path("data/ensemble.json")
          age = 99
          if p.exists():
              t = json.loads(p.read_text(encoding="utf-8")).get("tuned")
              if t:
                  age = (dt.datetime.now() - dt.datetime.fromisoformat(t)).days
          print(age)
          PY
          age=$(cat /tmp/age.txt)
          echo "ensemble age: $age days"
          if [ "$age" -ge 7 ]; then python -m oracle backtest --days 540 --step 14; fi

      - name: Predict and export
        run: python -m oracle predict --days 8 --export

      - name: Commit results
        run: |
          git config user.name "score-oracle-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/data.json data/*.csv data/*.json data/opinions 2>/dev/null || true
          git diff --cached --quiet || git commit -m "predictions $(date -u +%Y-%m-%d\ %H:%M) UTC"
          git stash --include-untracked 2>/dev/null || true
          git pull --rebase -X theirs
          git push
          git stash drop 2>/dev/null || true
