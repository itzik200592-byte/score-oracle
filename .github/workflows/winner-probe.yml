name: Winner probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Plain GET of the public odds endpoint from GitHub
        run: |
          curl -s -o out.json -w "HTTP %{http_code} size %{size_download} time %{time_total}s\n" -H "Origin: https://www.winner.co.il" -H "Referer: https://www.winner.co.il/" -H "User-Agent: Mozilla/5.0" "https://api.winner.co.il/v2/publicapi/GetCMobileLine?lineChecksum=0"
          head -c 300 out.json; echo
